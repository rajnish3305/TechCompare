<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Admin Dashboard - TechCompare</title>
    <link rel="stylesheet" href="admin.css">

</head>
<body>
    <header>
        <h1>
            TechCompare Admin
        </h1>
        <button onclick="logoutAdmin()">
            Logout
        </button>
    </header>
    <main>
        <section class="stats-container">
            <div class="stat-card">
                <div class="stat-icon">
                    📦
                </div>
                <div>
                    <p>Total Products</p>
                    <h2 id="totalProducts">
                        0
                    </h2>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">
                    📂
                </div>
                <div>
                    <p>Categories</p>
                    <h2 id="totalCategories">
                        0
                    </h2>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">
                    ⭐
                </div>
                <div>
                    <p>Average Rating</p>
                    <h2 id="averageRating">
                        0
                    </h2>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">
                    💰
                </div>
                <div>
                    <p>Average Price</p>
                    <h2 id="averagePrice">
                        ₹0
                    </h2>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">
                    ⭐
                </div>
                <div>
                    <p>Highest Rated</p>
                    <h2 id="highestRated">
                        -
                    </h2>
                </div>
            </div>
        </section>
        <section class="analytics-section">
            <h2>📊 Category Analytics</h2>
            <div id="categoryAnalytics">
                Loading...
            </div>
        </section>

        <!-- ADD PRODUCT -->
        <section class="admin-section">
            <h2>
                ➕ Add Product
            </h2>
            <form id="productForm">
                <input
                    type="text"
                    id="productName"
                    placeholder="Product Name"
                    required
                >
                <input
                    type="text"
                    id="brand"
                    placeholder="Brand"
                    required
                >
                <select  id="category">
                    <option value="">Select Category</option>
                    <option value="Smartphone">Smartphone</option>
                    <option value="Laptop">Laptop</option>
                    <option value="Headphone">Headphone</option>
                </select>
                <input
                    type="number"
                    id="price"
                    placeholder="Price"
                    required
                >
                <input
                    type="number"
                    step="0.1"
                    id="rating"
                    placeholder="Rating"
                    required
                >
                <div class="image-input-group">
                    <label for="image">
                        Product Image URL
                    </label>
                    <input
                        type="text"
                        id="image"
                        placeholder="Paste image URL"
                    >
                    <img
                        id="imagePreview"
                        class="image-preview"
                        src=""
                        alt="Product Preview"
                    >
                </div>
                <div id="specificationsContainer"></div>
                <button type="submit">
                    Add Product
                </button>
            </form>
            <p id="productMessage"></p>
        </section>
        <!-- PRODUCT LIST -->
        <section class="admin-section">
            <h2>
                📦 Manage Products
            </h2>
            <input
                type="text"
                id="adminSearch"
                placeholder="🔍 Search products..."
            >
            <select id="adminCategoryFilter">
                <option value="All">All Categories</option>
            </select>
            <select id="adminSort">
                <option value="default">
                    Sort By
                </option>
                <option value="priceLow">
                    Price: Low → High
                </option>
                <option value="priceHigh">
                    Price: High → Low
                </option>
                <option value="ratingHigh">
                    Rating: High → Low
                </option>
                <option value="nameAZ">
                    Name: A → Z
                </option>
            </select>
            <div id="adminProducts">
                <p>
                    Loading products...
                </p>
            </div>
            <div id="pagination">
                <button id="prevPage">
                    ← Previous
                </button>
                <span id="pageInfo">
                    Page 1
                </span>
                <button id="nextPage">
                    Next →
                </button>
            </div>
        </section>

        <!-- EDIT PRODUCT MODAL -->
        <div id="editModal" class="edit-modal">
            <div class="edit-modal-content">
                <h2>✏️ Edit Product</h2>
                <form id="editProductForm">
                    <input
                        type="hidden"
                        id="editProductId"
                    >
                    <input
                        type="text"
                        id="editProductName"
                        placeholder="Product Name"
                        required
                    >
                    <input
                        type="text"
                        id="editBrand"
                        placeholder="Brand"
                        required
                    >
                    <select  id="editCategory">
                        <option value="">Select Category</option>
                        <option value="Smartphone">Smartphone</option>
                        <option value="Laptop">Laptop</option>
                        <option value="Headphone">Headphone</option>
                    </select>
                    <input
                        type="number"
                        id="editPrice"
                        placeholder="Price"
                        required
                    >
                    <input
                        type="number"
                        step="0.1"
                        id="editRating"
                        placeholder="Rating"
                        required
                    >
                    <input
                        type="text"
                        id="editImage"
                        placeholder="Image URL"
                    >
                    <img
                        id="editImagePreview"
                        class="image-preview"
                        src=""
                        alt="Product Preview"
                    >
                    <div id="editSpecificationsContainer"></div>
                    <div id="editModal"></div>
                    <div class="edit-modal-buttons">
                        <button type="submit">
                            Update Product
                        </button>
                        <button
                            type="button"
                            onclick="closeEditModal()"
                        >
                            Cancel
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>
    <script src="admin.js"></script>
</body>
</html>
